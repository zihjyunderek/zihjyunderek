name: Update README cards

# The only automation this repo needs.
#
# Renders the GitHub stats cards to SVGs committed under profile/ instead of
# hot-linking the public github-readme-stats instance. Upstream explicitly
# warns that the public endpoint is best-effort and can serve a "Something
# went wrong" card under load. A committed SVG cannot break: if the service is
# down, yesterday's card is still there. That matters here because the profile
# has to look right for months at a stretch without anyone watching it.
#
# Runs daily, on push to main, and on demand.
#
# COLOURS ARE LOAD-BEARING. The cards use a transparent background so they sit
# on GitHub's light and dark themes alike, which means the text colours cannot
# come from the portfolio palette: brand navy 1D3557 scores 1.53:1 against the
# dark canvas (#0D1117) and body ink 1C1917 scores 1.08:1 — both effectively
# invisible. The values below are the dual-theme-safe substitutes:
#
#   2F6FBF  title / icons   5.06:1 on light, 3.74:1 on dark
#   6E7781  body text       4.55:1 on light, 4.16:1 on dark
#
# Changing them back to the portfolio palette will make the dark-theme card
# unreadable. Re-check contrast against BOTH canvases before editing.
#
# Private stats: by default this uses GITHUB_TOKEN, which sees public repos
# only. To count private work, create a PAT with `repo` + `read:user` scope and
# save it as the repository secret GRS_TOKEN. The expression below picks it up
# automatically; nothing else changes.

on:
  schedule:
    - cron: '0 20 * * *'   # 04:00 Asia/Taipei
  push:
    branches: [main]
    paths: ['.github/workflows/update-cards.yml']
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&card_width=340&bg_color=00000000&title_color=2F6FBF&text_color=6E7781

      # Not referenced by README.md today, kept so the card is one line away
      # from being reinstated. Delete this step if it stays unused.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&card_width=440&bg_color=00000000&title_color=2F6FBF&icon_color=2F6FBF&text_color=6E7781

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh README cards" || exit 0
          git push
